<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AIBE MCQ Practice</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400;1,600&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ─── TOKENS ─────────────────────────────────────────────── */
:root{
  --bg:        #0c0f14;
  --surface:   #13181f;
  --surface2:  #1a2130;
  --border:    #252d3a;
  --border2:   #2f3c50;
  --accent:    #d4a54a;
  --accent2:   #f0c97a;
  --accent-bg: rgba(212,165,74,.08);
  --green:     #3ecf8e;
  --green-bg:  rgba(62,207,142,.10);
  --red:       #f06a6a;
  --red-bg:    rgba(240,106,106,.10);
  --blue:      #60a5fa;
  --blue-bg:   rgba(96,165,250,.10);
  --purple:    #a78bfa;
  --purple-bg: rgba(167,139,250,.10);
  --text:      #e8edf5;
  --text2:     #8a97ab;
  --text3:     #55647a;
  --serif:     'Cormorant Garamond', Georgia, serif;
  --sans:      'Outfit', sans-serif;
  --r:         10px;
  --r2:        16px;
  --shadow:    0 8px 32px rgba(0,0,0,.45);
}

*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:var(--sans);background:var(--bg);color:var(--text);min-height:100vh;line-height:1.6}

::-webkit-scrollbar{width:5px}
::-webkit-scrollbar-track{background:var(--surface)}
::-webkit-scrollbar-thumb{background:var(--border2);border-radius:99px}
::-webkit-scrollbar-thumb:hover{background:var(--accent)}

/* ─── HEADER ─────────────────────────────────────────────── */
header{
  position:sticky;top:0;z-index:200;
  background:rgba(12,15,20,.9);
  backdrop-filter:blur(18px);
  -webkit-backdrop-filter:blur(18px);
  border-bottom:1px solid var(--border);
  padding:0 28px;height:62px;
  display:flex;align-items:center;gap:14px;
}
.h-icon{
  width:34px;height:34px;flex-shrink:0;
  background:linear-gradient(135deg,var(--accent),var(--accent2));
  border-radius:9px;
  display:flex;align-items:center;justify-content:center;
  font-family:var(--serif);font-size:17px;font-weight:700;color:var(--bg);
}
.h-title{font-family:var(--serif);font-size:19px;font-weight:700;color:var(--text);letter-spacing:.01em}
.h-sub{font-size:10px;font-weight:500;color:var(--text3);letter-spacing:.12em;text-transform:uppercase;margin-top:-2px}
.h-spacer{flex:1}

/* MODE TOGGLE */
.mode-toggle{
  display:flex;align-items:center;
  background:var(--surface2);
  border:1px solid var(--border2);
  border-radius:10px;
  padding:3px;gap:2px;
}
.mode-btn{
  display:flex;align-items:center;gap:6px;
  padding:6px 14px;
  border:none;border-radius:7px;
  font-family:var(--sans);font-size:12px;font-weight:600;
  cursor:pointer;transition:all .2s;
  color:var(--text3);background:transparent;
  white-space:nowrap;
}
.mode-btn .mode-icon{font-size:13px}
.mode-btn.active-study{
  background:var(--green-bg);
  color:var(--green);
  border:1px solid rgba(62,207,142,.25);
}
.mode-btn.active-exam{
  background:var(--purple-bg);
  color:var(--purple);
  border:1px solid rgba(167,139,250,.25);
}
.mode-btn:not(.active-study):not(.active-exam):hover{color:var(--text2);background:var(--border)}

/* MODE INDICATOR BANNER */
.mode-banner{
  display:flex;align-items:center;gap:10px;
  padding:10px 16px;
  border-radius:var(--r);
  margin-bottom:20px;
  font-size:13px;font-weight:500;
  animation:fadeUp .3s ease;
}
.mode-banner.study{
  background:var(--green-bg);
  border:1px solid rgba(62,207,142,.2);
  color:var(--green);
}
.mode-banner.exam{
  background:var(--purple-bg);
  border:1px solid rgba(167,139,250,.2);
  color:var(--purple);
}
.mode-banner strong{font-weight:700;margin-right:4px}
.mode-banner span{color:var(--text3);font-size:12px}

.h-stats{display:flex;gap:6px;opacity:0;transition:opacity .4s}
.h-stats.show{opacity:1}
.hstat{
  display:flex;align-items:center;gap:6px;
  background:var(--surface2);border:1px solid var(--border);
  border-radius:8px;padding:5px 11px;font-size:12px;font-weight:500;
  white-space:nowrap;
}
.hstat .dot{width:7px;height:7px;border-radius:50%}
.hstat.total .dot{background:var(--accent)}
.hstat.score .dot{background:var(--green)}
.hstat .val{color:var(--accent2);font-weight:700}

/* ─── LAYOUT ─────────────────────────────────────────────── */
.shell{display:flex;min-height:calc(100vh - 62px)}

/* ─── SIDEBAR ────────────────────────────────────────────── */
.sidebar{
  width:264px;flex-shrink:0;
  background:var(--surface);border-right:1px solid var(--border);
  position:sticky;top:62px;height:calc(100vh - 62px);
  overflow-y:auto;padding:14px 0;
}
.sb-head{padding:4px 18px 12px;font-size:10px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--text3);border-bottom:1px solid var(--border);margin-bottom:6px}
.cat-btn{
  display:flex;align-items:center;gap:10px;width:100%;
  padding:10px 18px;background:none;border:none;cursor:pointer;
  text-align:left;font-family:var(--sans);font-size:13px;font-weight:400;
  color:var(--text2);transition:all .15s;border-left:2px solid transparent;position:relative;
}
.cat-btn:hover{background:var(--surface2);color:var(--text)}
.cat-btn.active{background:var(--accent-bg);border-left-color:var(--accent);color:var(--accent2);font-weight:600}
.cat-label{flex:1;line-height:1.35}
.cat-pill .cnt{font-size:11px;font-weight:700;background:var(--border2);color:var(--text3);padding:1px 7px;border-radius:20px}
.cat-btn.active .cat-pill .cnt{background:var(--accent);color:var(--bg)}
.cat-progress{position:absolute;bottom:0;left:0;right:0;height:2px;background:var(--border);overflow:hidden}
.cat-progress-fill{height:100%;background:var(--green);transition:width .4s ease}

/* ─── MAIN ───────────────────────────────────────────────── */
.main{flex:1;padding:32px 40px;max-width:860px}

@media(max-width:900px){.sidebar{width:210px}.main{padding:22px 18px}}
@media(max-width:640px){
  .shell{flex-direction:column}
  .sidebar{width:100%;height:auto;position:static;border-right:none;border-bottom:1px solid var(--border)}
  .main{padding:18px 12px}
  header{padding:0 14px;gap:8px}
  .mode-btn .mode-label{display:none}
  .h-stats{display:none!important}
}

/* ─── LOADING ────────────────────────────────────────────── */
.loader{display:flex;flex-direction:column;align-items:center;justify-content:center;height:60vh;gap:20px}
.spin{width:40px;height:40px;border:2px solid var(--border2);border-top-color:var(--accent);border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.loader p{font-size:13px;color:var(--text3);letter-spacing:.06em}
.err-box{background:var(--red-bg);border:1px solid var(--red);border-radius:var(--r2);padding:24px 28px;color:var(--red);max-width:480px;margin:60px auto}
.err-box strong{display:block;margin-bottom:8px;font-size:16px}

/* ─── SECTION HEADER ─────────────────────────────────────── */
.sec-head{margin-bottom:24px;padding-bottom:18px;border-bottom:1px solid var(--border)}
.sec-head h2{font-family:var(--serif);font-size:30px;font-weight:700;color:var(--text);letter-spacing:.01em;line-height:1.2;margin-bottom:10px}
.sec-meta{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.badge{font-size:11px;font-weight:600;padding:3px 10px;border-radius:20px;letter-spacing:.04em}
.badge.gold{background:var(--accent-bg);color:var(--accent2);border:1px solid rgba(212,165,74,.2)}
.badge.blue{background:var(--blue-bg);color:var(--blue);border:1px solid rgba(96,165,250,.2)}
.badge.green{background:var(--green-bg);color:var(--green);border:1px solid rgba(62,207,142,.2)}
.badge.red{background:var(--red-bg);color:var(--red);border:1px solid rgba(240,106,106,.2)}

.prog-wrap{background:var(--surface2);border-radius:99px;height:4px;margin:0 0 28px;overflow:hidden}
.prog-fill{height:100%;background:linear-gradient(90deg,var(--accent),var(--green));border-radius:99px;transition:width .5s cubic-bezier(.4,0,.2,1)}

/* ─── SCORE BANNER ───────────────────────────────────────── */
.score-banner{
  background:var(--surface2);border:1px solid var(--border2);border-top:3px solid var(--accent);
  border-radius:var(--r2);padding:24px 28px;margin-bottom:28px;
  display:flex;align-items:center;gap:24px;flex-wrap:wrap;animation:fadeUp .5s ease;
}
.sb-pct{font-family:var(--serif);font-size:56px;font-weight:700;color:var(--accent);line-height:1}
.sb-info h3{font-family:var(--serif);font-size:19px;font-weight:600;margin-bottom:3px}
.sb-info p{font-size:13px;color:var(--text3)}
.sb-nums{margin-left:auto;display:flex;gap:18px;flex-wrap:wrap}
.sn-item{text-align:center}
.sn-item .v{font-family:var(--serif);font-size:26px;font-weight:700;line-height:1}
.sn-item .l{font-size:10px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--text3);display:block;margin-top:2px}
.v.g{color:var(--green)}.v.r{color:var(--red)}.v.m{color:var(--accent)}

/* ─── QUESTION CARD ──────────────────────────────────────── */
.q-card{
  background:var(--surface);border:1px solid var(--border);
  border-radius:var(--r2);padding:26px;margin-bottom:14px;
  position:relative;transition:border-color .2s,box-shadow .2s;
  animation:fadeUp .3s ease both;
}
.q-card:hover{border-color:var(--border2);box-shadow:var(--shadow)}

/* Study mode card highlight */
.q-card.study-card{border-left:3px solid var(--green)}

@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}

.q-tag{
  position:absolute;top:-1px;left:-1px;
  background:var(--surface2);border:1px solid var(--border2);
  border-top-left-radius:var(--r2);border-bottom-right-radius:var(--r);
  padding:3px 12px;font-size:11px;font-weight:700;letter-spacing:.06em;color:var(--accent);
}
.q-text{font-size:15px;font-weight:400;line-height:1.7;color:var(--text);margin:22px 0 18px}

/* ─── OPTIONS ────────────────────────────────────────────── */
.opts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
@media(max-width:560px){.opts{grid-template-columns:1fr}}

.opt{
  display:flex;align-items:flex-start;gap:10px;
  padding:12px 14px;border:1.5px solid var(--border2);border-radius:var(--r);
  background:var(--surface2);cursor:pointer;text-align:left;
  font-family:var(--sans);font-size:13px;font-weight:400;
  line-height:1.5;color:var(--text2);transition:all .15s;
}
.opt:hover:not(:disabled){border-color:var(--accent);color:var(--text);background:var(--accent-bg)}
.opt:disabled{cursor:default}
.opt-key{
  flex-shrink:0;width:22px;height:22px;background:var(--border2);border-radius:6px;
  font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;
  color:var(--text3);margin-top:1px;transition:all .15s;
}

/* State classes */
.opt.correct{border-color:var(--green)!important;background:var(--green-bg)!important;color:var(--text)!important}
.opt.correct .opt-key{background:var(--green);color:var(--bg)}
.opt.wrong{border-color:var(--red)!important;background:var(--red-bg)!important;color:var(--text2)!important}
.opt.wrong .opt-key{background:var(--red);color:#fff}
.opt.dimmed{opacity:.38}

/* Study mode: correct always highlighted, selectable = just visual hover */
.opt.study-correct{border-color:var(--green)!important;background:var(--green-bg)!important;color:var(--text)!important}
.opt.study-correct .opt-key{background:var(--green);color:var(--bg)}

/* Exam mode: pending selection highlight */
.opt.exam-selected{border-color:var(--purple)!important;background:var(--purple-bg)!important;color:var(--text)!important}
.opt.exam-selected .opt-key{background:var(--purple);color:#fff}

/* ─── RESULT ROW ─────────────────────────────────────────── */
.result-row{margin-top:14px;padding-top:12px;border-top:1px solid var(--border);display:flex;flex-direction:column;gap:10px}
.result-line{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.result-badge{font-size:11px;font-weight:700;padding:3px 11px;border-radius:20px;letter-spacing:.04em}
.result-badge.ok{background:var(--green-bg);color:var(--green);border:1px solid rgba(62,207,142,.25)}
.result-badge.no{background:var(--red-bg);color:var(--red);border:1px solid rgba(240,106,106,.25)}
.result-ans{font-size:13px;color:var(--text2)}
.result-ans strong{color:var(--accent2);font-weight:600}

/* ─── RATIONALE ──────────────────────────────────────────── */
.rationale{
  background:rgba(212,165,74,.05);border:1px solid rgba(212,165,74,.15);
  border-left:3px solid var(--accent);border-radius:0 var(--r) var(--r) 0;
  padding:12px 16px;font-size:13px;line-height:1.65;color:var(--text2);
  animation:fadeUp .25s ease;
}
.rationale .rat-label{font-size:10px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--accent);margin-bottom:5px;display:block}

/* Study mode: rationale always visible, slightly different style */
.rationale.study-always{background:rgba(62,207,142,.04);border-color:rgba(62,207,142,.2);border-left-color:var(--green)}
.rationale.study-always .rat-label{color:var(--green)}

/* ─── EXAM CHECK BUTTON ──────────────────────────────────── */
.check-btn{
  margin-top:14px;padding:9px 20px;
  background:var(--purple-bg);
  border:1.5px solid rgba(167,139,250,.35);
  border-radius:var(--r);
  font-family:var(--sans);font-size:13px;font-weight:600;
  color:var(--purple);cursor:pointer;transition:all .15s;
  display:inline-flex;align-items:center;gap:7px;
}
.check-btn:hover{background:rgba(167,139,250,.18);border-color:var(--purple)}
.check-btn:disabled{opacity:.4;cursor:default}

.show-btn{
  margin-top:12px;padding:7px 14px;
  background:none;border:1px solid var(--border2);border-radius:var(--r);
  color:var(--text3);font-family:var(--sans);font-size:12px;font-weight:500;
  cursor:pointer;transition:all .15s;
}
.show-btn:hover{border-color:var(--accent);color:var(--accent2);background:var(--accent-bg)}

/* ─── PAGINATION ─────────────────────────────────────────── */
.pager{display:flex;align-items:center;gap:6px;margin-top:28px;flex-wrap:wrap}
.pg-btn{
  padding:6px 13px;border:1px solid var(--border2);border-radius:var(--r);
  background:var(--surface2);font-family:var(--sans);font-size:12px;font-weight:500;
  cursor:pointer;color:var(--text2);transition:all .15s;
}
.pg-btn:hover:not(:disabled){border-color:var(--accent);color:var(--accent2);background:var(--accent-bg)}
.pg-btn:disabled{opacity:.3;cursor:default}
.pg-btn.cur{background:var(--accent);color:var(--bg);border-color:var(--accent);font-weight:700}
.pg-sep{color:var(--text3);font-size:12px;padding:0 3px}
.pg-info{font-size:11px;color:var(--text3);margin-left:6px}

/* ─── RESET BTN ──────────────────────────────────────────── */
.reset-btn{
  margin-top:28px;padding:9px 22px;
  background:transparent;border:1.5px solid var(--accent);border-radius:var(--r);
  font-family:var(--sans);font-size:13px;font-weight:600;
  color:var(--accent2);cursor:pointer;transition:all .15s;
  display:inline-flex;align-items:center;gap:7px;
}
.reset-btn:hover{background:var(--accent-bg)}
</style>
</head>
<body>

<header>
  <div class="h-icon">⚖</div>
  <div>
    <div class="h-title">AIBE Prep</div>
    <div class="h-sub">All India Bar Examination · MCQ Practice</div>
  </div>
  <div class="h-spacer"></div>

  <!-- MODE TOGGLE -->
  <div class="mode-toggle" id="modeToggle">
    <button class="mode-btn active-study" id="btnStudy" data-mode="study">
      <span class="mode-icon">📖</span>
      <span class="mode-label">Study</span>
    </button>
    <button class="mode-btn" id="btnExam" data-mode="exam">
      <span class="mode-icon">📝</span>
      <span class="mode-label">Exam</span>
    </button>
  </div>

  <div class="h-stats" id="hStats">
    <div class="hstat total"><span class="dot"></span><span class="val" id="hCats">0</span>&nbsp;categories&nbsp;·&nbsp;<span id="hTotal">0</span>&nbsp;Qs</div>
    <div class="hstat score"><span class="dot"></span>Score:&nbsp;<span class="val" id="hScore">0 / 0</span></div>
  </div>
</header>

<div class="shell">
  <aside class="sidebar" id="sidebar">
    <div class="sb-head">Categories</div>
    <div id="catList"></div>
  </aside>
  <main class="main" id="main">
    <div class="loader" id="loader">
      <div class="spin"></div>
      <p>Loading question bank…</p>
    </div>
    <div id="content" style="display:none"></div>
  </main>
</div>

<script>
const API = 'https://api.npoint.io/6f078d15ae65a4328684';
const PER  = 10;

let data = [];
let cat  = 0;
let mode = 'study'; // 'study' | 'exam'
let pg   = {};      // pg[ci] = page index
let st   = {};      // st[ci][qi] = {answered, chosen, revealed, examPending}
                    // examPending = chosen but not yet checked in exam mode

/* ─── BOOT ─────────────────────────────────────────── */
async function boot(){
  try{
    const r = await fetch(API);
    if(!r.ok) throw new Error(`HTTP ${r.status}`);
    let j = await r.json();
    if(!Array.isArray(j)){
      const k = Object.keys(j).find(k=>Array.isArray(j[k]));
      j = k ? j[k] : [j];
    }
    data = j
      .map(c=>({
        title: c.title||c.name||c.category||'Untitled',
        data:  Array.isArray(c.data)?c.data:Array.isArray(c.questions)?c.questions:[]
      }))
      .filter(c=>c.data.length);
    if(!data.length) throw new Error('No categories found.');
    data.forEach((c,ci)=>{ pg[ci]=0; st[ci]={}; c.data.forEach((_,qi)=>initQ(ci,qi)); });
    document.getElementById('hTotal').textContent = data.reduce((s,c)=>s+c.data.length,0);
    document.getElementById('hCats').textContent  = data.length;
    syncHeader();
    document.getElementById('hStats').classList.add('show');
    buildSidebar();
    show(0);
  }catch(e){
    document.getElementById('loader').innerHTML=`
      <div class="err-box"><strong>⚠ Failed to load data</strong>
      Could not reach the API.<br><br><small style="opacity:.5">${e.message}</small></div>`;
  }
}

function initQ(ci,qi){
  st[ci][qi]={answered:false,chosen:null,revealed:false,examPending:false};
}

/* ─── MODE SWITCH ──────────────────────────────────── */
function setMode(m){
  mode = m;
  document.getElementById('btnStudy').className = 'mode-btn' + (m==='study'?' active-study':'');
  document.getElementById('btnExam').className  = 'mode-btn' + (m==='exam'?' active-exam':'');
  show(cat);
}

/* ─── SIDEBAR ──────────────────────────────────────── */
function buildSidebar(){
  document.getElementById('catList').innerHTML = data.map((c,i)=>`
    <button class="cat-btn ${i===0?'active':''}" id="cb${i}" data-cat="${i}">
      <span class="cat-label">${c.title}</span>
      <span class="cat-pill"><span class="cnt">${c.data.length}</span></span>
      <div class="cat-progress"><div class="cat-progress-fill" id="cpf${i}" style="width:0%"></div></div>
    </button>`).join('');
}

function syncSidebarProgress(){
  data.forEach((_,ci)=>{
    const total=data[ci].data.length;
    const done=Object.values(st[ci]).filter(s=>s.answered||s.revealed).length;
    const el=document.getElementById(`cpf${ci}`);
    if(el) el.style.width=total?(done/total*100)+'%':'0%';
  });
}

function syncHeader(){
  let correct=0,answered=0;
  data.forEach((c,ci)=>{
    c.data.forEach((q,qi)=>{
      const s=st[ci][qi];
      if(s.answered){answered++;if(isOk(q,s.chosen))correct++;}
    });
  });
  document.getElementById('hScore').textContent=`${correct} / ${answered}`;
}

/* ─── RENDER ───────────────────────────────────────── */
function show(idx){
  cat=idx;
  document.querySelectorAll('.cat-btn').forEach(b=>b.classList.remove('active'));
  const cb=document.getElementById(`cb${idx}`);
  if(cb){cb.classList.add('active');cb.scrollIntoView({block:'nearest'})}

  const c=data[idx], qs=c.data, p=pg[idx];
  const start=p*PER, end=Math.min(start+PER,qs.length);
  const total=Math.ceil(qs.length/PER);
  const done=Object.values(st[idx]).filter(s=>s.answered).length;
  const right=qs.reduce((a,q,qi)=>a+(st[idx][qi].answered&&isOk(q,st[idx][qi].chosen)?1:0),0);
  const pct=qs.length?Math.round(done/qs.length*100):0;

  // Mode banner
  const bannerHtml = mode==='study'
    ? `<div class="mode-banner study">📖 <strong>Study Mode</strong> <span>Correct answers and rationale are shown immediately</span></div>`
    : `<div class="mode-banner exam">📝 <strong>Exam Mode</strong> <span>Select an answer then tap "Check Answer" to see the result</span></div>`;

  let h = bannerHtml + `
    <div class="sec-head">
      <h2>${c.title}</h2>
      <div class="sec-meta">
        <span class="badge gold">${qs.length} Questions</span>
        <span class="badge blue">${done} Answered</span>
        <span class="badge green">${right} Correct</span>
        ${done-right>0?`<span class="badge red">${done-right} Wrong</span>`:''}
      </div>
    </div>
    <div class="prog-wrap"><div class="prog-fill" style="width:${pct}%"></div></div>`;

  if(done===qs.length&&qs.length>0){
    const sp=Math.round(right/qs.length*100);
    h+=`<div class="score-banner">
      <div class="sb-pct">${sp}%</div>
      <div class="sb-info"><h3>Section Complete</h3><p>${c.title}</p></div>
      <div class="sb-nums">
        <div class="sn-item"><div class="v g">${right}</div><span class="l">Correct</span></div>
        <div class="sn-item"><div class="v r">${done-right}</div><span class="l">Wrong</span></div>
        <div class="sn-item"><div class="v m">${qs.length}</div><span class="l">Total</span></div>
      </div>
    </div>`;
  }

  qs.slice(start,end).forEach((q,li)=>{
    const qi=start+li;
    const s=st[idx][qi];
    const opts=q.options||q.Options||[];
    const ans=q.correctAnswer||q.answer||q.correct_answer||'';
    const rat=q.rationale||q.explanation||'';
    const num=q.questionNumber||qi+1;

    if(mode==='study'){
      h+=renderStudy(idx,qi,q,opts,ans,rat,num,s,li);
    } else {
      h+=renderExam(idx,qi,q,opts,ans,rat,num,s,li);
    }
  });

  // Pagination
  if(total>1){
    h+=`<div class="pager"><button class="pg-btn" data-pg-ci="${idx}" data-pg="${p-1}" ${p===0?'disabled':''}>← Prev</button>`;
    pages(p,total).forEach(x=>{
      if(x==='…') h+=`<span class="pg-sep">…</span>`;
      else h+=`<button class="pg-btn ${x===p?'cur':''}" data-pg-ci="${idx}" data-pg="${x}">${x+1}</button>`;
    });
    h+=`<button class="pg-btn" data-pg-ci="${idx}" data-pg="${p+1}" ${p===total-1?'disabled':''}>Next →</button>
      <span class="pg-info">Page ${p+1} of ${total}</span></div>`;
  }

  if(done===qs.length&&qs.length>0){
    h+=`<button class="reset-btn" data-reset-ci="${idx}">↺ Reset Section</button>`;
  }

  const loader=document.getElementById('loader');
  const content=document.getElementById('content');
  loader.style.display='none';
  content.style.display='block';
  content.innerHTML=h;
  window.scrollTo({top:0,behavior:'smooth'});
}

/* ─── STUDY CARD ───────────────────────────────────── */
// In study mode: correct option always highlighted, rationale always shown
function renderStudy(ci,qi,q,opts,ans,rat,num,s,li){
  const delay=li*0.04;
  let h=`<div class="q-card study-card" id="qc${qi}" style="animation-delay:${delay}s">
    <div class="q-tag">Q ${num}</div>
    <div class="q-text">${q.question||''}</div>
    <div class="opts">`;

  opts.forEach((o,oi)=>{
    const key=String.fromCharCode(65+oi);
    // Study mode: only highlight correct, never show wrong selections
    let cls = matchOpt(q,o) ? 'study-correct' : '';
    h+=`<button class="opt ${cls}" disabled
          data-ci="${ci}" data-qi="${qi}" data-oi="${oi}">
        <span class="opt-key">${key}</span><span>${o}</span>
      </button>`;
  });

  h+=`</div>`;
  if(rat) h+=`<div class="result-row"><div class="rationale study-always"><span class="rat-label">💡 Rationale</span>${rat}</div></div>`;
  h+=`</div>`;
  return h;
}

/* ─── EXAM CARD ────────────────────────────────────── */
// Exam mode: user picks option → "Check Answer" button → reveal correct/wrong
function renderExam(ci,qi,q,opts,ans,rat,num,s,li){
  const delay=li*0.04;
  let h=`<div class="q-card" id="qc${qi}" style="animation-delay:${delay}s">
    <div class="q-tag">Q ${num}</div>
    <div class="q-text">${q.question||''}</div>
    <div class="opts">`;

  opts.forEach((o,oi)=>{
    const key=String.fromCharCode(65+oi);
    let cls='', disabled=false;

    if(s.answered){
      // Already checked — show final result
      if(matchOpt(q,o))     cls='correct';
      else if(s.chosen===o) cls='wrong';
      else                  cls='dimmed';
      disabled=true;
    } else if(s.examPending){
      // Chosen but not yet checked
      cls = s.chosen===o ? 'exam-selected' : '';
      // allow re-selection before checking
    }

    h+=`<button class="opt ${cls}" ${disabled?'disabled':''}
          data-ci="${ci}" data-qi="${qi}" data-oi="${oi}">
        <span class="opt-key">${key}</span><span>${o}</span>
      </button>`;
  });

  h+=`</div>`;

  if(s.answered){
    // Result + rationale
    const ok=isOk(q,s.chosen);
    h+=`<div class="result-row">
      <div class="result-line">
        <span class="result-badge ${ok?'ok':'no'}">${ok?'✓ Correct':'✗ Incorrect'}</span>
        ${!ok?`<span class="result-ans">Correct: <strong>${ans}</strong></span>`:''}
      </div>
      ${rat?`<div class="rationale"><span class="rat-label">💡 Rationale</span>${rat}</div>`:''}
    </div>`;
  } else {
    // Check button — enabled only after a selection
    h+=`<button class="check-btn" data-check-ci="${ci}" data-check-qi="${qi}"
          ${s.examPending?'':'disabled'}>
        ✦ Check Answer
      </button>`;
  }

  h+=`</div>`;
  return h;
}

/* ─── ACTIONS ──────────────────────────────────────── */
function selectExamOpt(ci,qi,oi){
  const o=data[ci].data[qi].options[oi];
  st[ci][qi].chosen=o;
  st[ci][qi].examPending=true;
  // Re-render just the options + button without full show() to avoid scroll jump
  const card=document.getElementById(`qc${qi}`);
  if(!card){show(ci);return;}
  const q=data[ci].data[qi];
  const opts=q.options||[];
  // Update option classes
  card.querySelectorAll('.opt').forEach((btn,i)=>{
    btn.classList.remove('exam-selected','correct','wrong','dimmed');
    if(opts[i]===o) btn.classList.add('exam-selected');
  });
  // Enable check button
  const chk=card.querySelector('.check-btn');
  if(chk) chk.disabled=false;
}

function checkAnswer(ci,qi){
  const s=st[ci][qi];
  if(!s.examPending||!s.chosen) return;
  s.answered=true;
  s.examPending=false;
  syncSidebarProgress();
  syncHeader();
  // Re-render just this card in-place
  const q=data[ci].data[qi];
  const opts=q.options||[];
  const ans=q.correctAnswer||q.answer||'';
  const rat=q.rationale||'';
  const card=document.getElementById(`qc${qi}`);
  if(!card){show(ci);return;}
  // Update options
  card.querySelectorAll('.opt').forEach((btn,i)=>{
    btn.classList.remove('exam-selected','correct','wrong','dimmed');
    btn.disabled=true;
    if(matchOpt(q,opts[i]))      btn.classList.add('correct');
    else if(opts[i]===s.chosen)  btn.classList.add('wrong');
    else                         btn.classList.add('dimmed');
  });
  // Replace action area
  const ok=isOk(q,s.chosen);
  let resultHtml=`<div class="result-row">
    <div class="result-line">
      <span class="result-badge ${ok?'ok':'no'}">${ok?'✓ Correct':'✗ Incorrect'}</span>
      ${!ok?`<span class="result-ans">Correct: <strong>${ans}</strong></span>`:''}
    </div>
    ${rat?`<div class="rationale"><span class="rat-label">💡 Rationale</span>${rat}</div>`:''}
  </div>`;
  const chk=card.querySelector('.check-btn');
  if(chk) chk.outerHTML=resultHtml;
  // Scroll card into view
  setTimeout(()=>card.scrollIntoView({behavior:'smooth',block:'nearest'}),60);
  // Update section header badges
  const qs=data[ci].data;
  const done=Object.values(st[ci]).filter(s=>s.answered).length;
  const right=qs.reduce((a,q,qi)=>a+(st[ci][qi].answered&&isOk(q,st[ci][qi].chosen)?1:0),0);
  const pct=qs.length?Math.round(done/qs.length*100):0;
  const meta=document.querySelector('.sec-meta');
  if(meta) meta.innerHTML=`
    <span class="badge gold">${qs.length} Questions</span>
    <span class="badge blue">${done} Answered</span>
    <span class="badge green">${right} Correct</span>
    ${done-right>0?`<span class="badge red">${done-right} Wrong</span>`:''}`;
  const pf=document.querySelector('.prog-fill');
  if(pf) pf.style.width=pct+'%';
  // Show full score banner if all done
  if(done===qs.length) show(ci);
}

function goP(ci,p){pg[ci]=p;show(ci);}

function reset(ci){
  pg[ci]=0;
  data[ci].data.forEach((_,qi)=>initQ(ci,qi));
  syncSidebarProgress();syncHeader();show(ci);
}

/* ─── HELPERS ──────────────────────────────────────── */
function getAns(q){return q.correctAnswer||q.answer||q.correct_answer||''}
function matchOpt(q,opt){
  const ans=String(getAns(q)).trim();
  if(String(opt).trim()===ans) return true;
  const opts=q.options||q.Options||[];
  const idx=opts.indexOf(opt);
  if(idx>-1){
    const l=String.fromCharCode(65+idx);
    if(ans.toUpperCase()===l) return true;
  }
  return false;
}
function isOk(q,chosen){return chosen!==null&&chosen!==undefined&&matchOpt(q,chosen)}
function pages(cur,total){
  if(total<=7) return Array.from({length:total},(_,i)=>i);
  if(cur<4)       return [0,1,2,3,4,'…',total-1];
  if(cur>total-5) return [0,'…',total-5,total-4,total-3,total-2,total-1];
  return [0,'…',cur-1,cur,cur+1,'…',total-1];
}

/* ─── EVENT DELEGATION ─────────────────────────────── */
document.addEventListener('click', e=>{
  const btn=e.target.closest('button');
  if(!btn) return;

  // Mode toggle
  if(btn.dataset.mode){ setMode(btn.dataset.mode); return; }

  // Sidebar cat
  if(btn.dataset.cat!==undefined){ show(+btn.dataset.cat); return; }

  // Option click
  if(btn.classList.contains('opt') && !btn.disabled){
    const ci=+btn.dataset.ci, qi=+btn.dataset.qi, oi=+btn.dataset.oi;
    if(mode==='exam'){
      selectExamOpt(ci,qi,oi);
    }
    // Study mode options are disabled, so no action needed
    return;
  }

  // Check answer (exam mode)
  if(btn.dataset.checkCi!==undefined){
    checkAnswer(+btn.dataset.checkCi, +btn.dataset.checkQi);
    return;
  }

  // Pagination
  if(btn.dataset.pgCi!==undefined){ goP(+btn.dataset.pgCi, +btn.dataset.pg); return; }

  // Reset
  if(btn.dataset.resetCi!==undefined){ reset(+btn.dataset.resetCi); return; }
});

boot();
</script>
